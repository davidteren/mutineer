# Single source for the CLI exit-code / --threshold contract.
# Edit this file, then run `rake docs:generate`.
---
threshold_readme: >-
  Exit 1 when the score is below FLOAT, or when nothing could be scored and
  something broke, or more than one mutant produced no verdict and they exceed
  10% of those attempted (default: 0 = off)
threshold_action: >-
  Fail (exit 1) when the mutation score is below this value, or when nothing
  could be scored and something broke, or more than one mutant produced no
  verdict and they exceed 10% of those attempted (0 = off).
exit_code_action: >-
  The exit code returned by mutineer (0 pass, 1
  below-threshold/incomplete-run/regressed, 2 usage).
exit_codes:
  - code: "0"
    meaning: Score ≥ threshold (or no gate) **and** no baseline regression.
  - code: "1"
    meaning: >-
      Score below `--threshold`, OR nothing could be scored and something
      broke, or more than one mutant produced no verdict and they exceed 10%
      of those attempted (under `--threshold` or `--baseline`), OR a
      `--baseline` regression, OR a runtime error.
  - code: "2"
    meaning: Usage / invalid-flag error (mistyped flag, bad path, unreadable baseline).
