name: Mutineer Ruby
description: >-
  Mutation-test your Ruby suite in CI; fail the build on new surviving mutants
  or a mutation-score drop versus a baseline.
author: David Teren
branding:
  icon: git-merge
  color: red

inputs:
  sources:
    description: >-
      Space-separated source files or directories to mutate (positional args to
      `mutineer run`). A directory is expanded to its **/*.rb files.
    required: true
  test:
    description: >-
      Space-separated test files covering the sources. Optional — when omitted,
      Mutineer auto-pairs each source to its test by convention.
    required: false
    default: ""
  since:
    description: >-
      Mutate only lines changed since this git ref (e.g. `origin/main`). On
      pull_request events this defaults to the PR's exact base commit from the
      event payload (fetched by the action when the checkout is shallow;
      falls back to the base branch tip). When neither resolves, the action
      warns and runs without an action-provided --since (a `since:` key in the
      repo's `.mutineer.yml` still applies). Pass `none` to force a full scan
      (passed through as `--no-since`, overriding `.mutineer.yml` too). An
      explicitly passed ref must resolve in the checkout (use `fetch-depth: 0`).
    required: false
    default: ""
  threshold:
    description: "Fail (exit 1) when the mutation score is below this value, or when nothing could be scored and something broke, or more than one mutant produced no verdict and they exceed 10% of those attempted (0 = off)."
    required: false
    default: ""
  baseline:
    description: >-
      Path to a prior `--format json` report. Fail (exit 1) on NEW survivors or
      a score drop versus this baseline.
    required: false
    default: ""
  baseline-epsilon:
    description: "Score-drop tolerance for `baseline` (default: 0 = any drop fails)."
    required: false
    default: ""
  operators:
    description: "Comma-separated operator names (default: the Tier-1 set)."
    required: false
    default: ""
  framework:
    description: "minitest or rspec (default: auto-detected from test file names)."
    required: false
    default: ""
  strategy:
    description: "reload (whole-file) or redefine (surgical)."
    required: false
    default: ""
  jobs:
    description: "Parallel worker count (default: processor count)."
    required: false
    default: ""
  rails:
    description: "Set to 'true' to boot config/environment once (Rails apps)."
    required: false
    default: "false"
  format:
    description: >-
      Report format: human or json (default: json so the report is
      machine-readable). The json format also feeds the job step summary and the
      per-survivor PR annotations; human/html formats skip both.
    required: false
    default: "json"
  output:
    description: >-
      Write the report to this file instead of stdout. When unset with the
      default json format, the report is written to a temp file (for the step
      summary and annotations) and still printed to the log.
    required: false
    default: ""
  extra-args:
    description: "Any additional raw flags appended verbatim to the mutineer invocation."
    required: false
    default: ""
  working-directory:
    description: "Directory to run Mutineer in (the project root)."
    required: false
    default: "."
  use-bundler:
    description: >-
      Run via `bundle exec mutineer` (true) instead of a standalone
      `gem install mutineer` (false). Use true when mutineer is in the
      project's Gemfile (required for --rails, which boots the app's bundle).
    required: false
    default: "false"
  version:
    description: "Gem version to install when use-bundler is false (default: latest)."
    required: false
    default: ""

outputs:
  exit-code:
    description: "The exit code returned by mutineer (0 pass, 1 below-threshold/incomplete-run/regressed, 2 usage)."
    value: ${{ steps.run.outputs.exit-code }}
  report:
    description: >-
      Path to the written report file: the `output` input when set, else the
      auto-routed JSON report path (json format). Unset when no report file
      exists (e.g. human format without `output`).
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install mutineer
      if: ${{ inputs.use-bundler != 'true' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$VERSION" ]; then
          gem install mutineer -v "$VERSION" --no-document
        else
          gem install mutineer --no-document
        fi

    - name: Run mutineer
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Pass every input through the environment — never interpolate
        # ${{ inputs.* }} directly into the script (command-injection safety).
        SOURCES: ${{ inputs.sources }}
        TESTS: ${{ inputs.test }}
        SINCE: ${{ inputs.since }}
        THRESHOLD: ${{ inputs.threshold }}
        BASELINE: ${{ inputs.baseline }}
        BASELINE_EPSILON: ${{ inputs.baseline-epsilon }}
        OPERATORS: ${{ inputs.operators }}
        FRAMEWORK: ${{ inputs.framework }}
        STRATEGY: ${{ inputs.strategy }}
        JOBS: ${{ inputs.jobs }}
        RAILS: ${{ inputs.rails }}
        FORMAT: ${{ inputs.format }}
        OUTPUT: ${{ inputs.output }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        USE_BUNDLER: ${{ inputs.use-bundler }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -o pipefail

        # Default --since to the PR base when unset — on pull_request events ONLY.
        # GITHUB_BASE_REF is also set on pull_request_target, but checkout there
        # defaults to the BASE branch itself: auto-scoping would diff the base
        # against itself, schedule zero mutants, and green the gate for any PR.
        # Pushes and manual runs keep the full scan. `since: none` forces a full
        # scan on PRs too. A shallow checkout (the actions/checkout default)
        # lacks the base ref, so fetch just its tip; when that fails, warn and
        # fall back to a full scan rather than exiting 2.
        NO_SINCE=""
        if [ "$SINCE" = "none" ]; then
          # --no-since (not just an omitted flag): a `since:` key in the repo's
          # .mutineer.yml would otherwise silently re-enable diff scoping.
          SINCE=""
          NO_SINCE="1"
        elif [ -z "$SINCE" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$GITHUB_BASE_REF" ]; then
          # Percent-escape the branch name for workflow-command messages: a
          # valid refname may contain %XX sequences the runner would decode
          # into extra commands.
          SAFE_BASE="${GITHUB_BASE_REF//%/%25}"
          # Prefer the PR's exact base commit from the event payload: the
          # branch tip can advance mid-job, and the checked-out merge ref was
          # computed against THIS sha, not the moving tip. An exact sha cannot
          # be stale, so an already-present object is trusted as-is.
          BASE_SHA=""
          if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "$GITHUB_EVENT_PATH" ] && command -v jq >/dev/null 2>&1; then
            BASE_SHA="$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
          fi
          if [ -n "$BASE_SHA" ] && { git rev-parse --verify -q "$BASE_SHA^{commit}" >/dev/null 2>&1 \
               || git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1; }; then
            SINCE="$BASE_SHA"
            echo "::notice::mutineer: scoping to lines changed since the PR base commit $BASE_SHA (pass 'since: none' for a full scan)."
          # Branch-tip fallback (no event payload / no jq / unfetchable sha):
          # fetch with a force-updating refspec so a stale origin/<base> in a
          # reused self-hosted workspace is refreshed, never trusted as-is.
          elif git fetch --no-tags --depth=1 origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF" >/dev/null 2>&1; then
            SINCE="origin/$GITHUB_BASE_REF"
            echo "::notice::mutineer: scoping to lines changed since origin/$SAFE_BASE (pass 'since: none' for a full scan)."
          else
            echo "::warning::mutineer: could not fetch the PR base; running without an action-provided --since (a .mutineer.yml 'since:' key may still scope the run). A full scan scores every mutant, not only the PR's changed lines."
          fi
        fi

        # The JSON report also feeds the step summary and the inline annotations,
        # so route it to a temp file when the caller set no `output`; the log
        # still shows it (cat below), so the visible behavior is unchanged.
        REPORT_FILE="$OUTPUT"
        AUTO_REPORT=""
        if [ "$FORMAT" = "json" ] && [ -z "$REPORT_FILE" ]; then
          # Unique per invocation, so multiple mutineer steps in one job can
          # never overwrite each other's auto-routed report (RUNNER_TEMP is
          # cleaned up at job end).
          REPORT_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/mutineer-report-XXXXXX")"
          AUTO_REPORT="1"
        fi

        args=(run)
        for s in $SOURCES; do args+=("$s"); done
        for t in $TESTS; do args+=(--test "$t"); done
        [ -n "$NO_SINCE" ]         && args+=(--no-since)
        [ -n "$SINCE" ]            && args+=(--since "$SINCE")
        [ -n "$THRESHOLD" ]        && args+=(--threshold "$THRESHOLD")
        [ -n "$BASELINE" ]         && args+=(--baseline "$BASELINE")
        [ -n "$BASELINE_EPSILON" ] && args+=(--baseline-epsilon "$BASELINE_EPSILON")
        [ -n "$OPERATORS" ]        && args+=(--operators "$OPERATORS")
        [ -n "$FRAMEWORK" ]        && args+=(--framework "$FRAMEWORK")
        [ -n "$STRATEGY" ]         && args+=(--strategy "$STRATEGY")
        [ -n "$JOBS" ]             && args+=(--jobs "$JOBS")
        [ "$RAILS" = "true" ]      && args+=(--rails)
        [ -n "$FORMAT" ]           && args+=(--format "$FORMAT")
        [ -n "$REPORT_FILE" ]      && args+=(--output "$REPORT_FILE")
        # shellcheck disable=SC2206
        [ -n "$EXTRA_ARGS" ]       && args+=($EXTRA_ARGS)
        # The summary, annotations, and `report=` output are driven by the
        # `format` and `output` INPUTS; a --format/--output smuggled through
        # extra-args would override the CLI flags behind the action's back and
        # silently break that plumbing. Explicit failure beats quiet misbehavior.
        case " $EXTRA_ARGS " in
          *" --format"* | *" --output"*)
            echo "::error::mutineer: extra-args must not carry --format/--output; use the 'format' and 'output' inputs (the step summary, annotations, and report output depend on them)."
            exit 2 ;;
        esac

        if [ "$USE_BUNDLER" = "true" ]; then
          runner=(bundle exec mutineer)
        else
          runner=(mutineer)
        fi

        # Freshness stamp: the summary, annotations, and `report=` output must
        # only ever consume a report THIS run wrote. Deleting a stale file is
        # not an option (a caller's `output` may equal its `baseline`, and a
        # pre-run delete would destroy the baseline before Mutineer loads it),
        # so instead require the report to be newer than this stamp.
        RUN_STAMP="$(mktemp "${RUNNER_TEMP:-/tmp}/mutineer-stamp-XXXXXX")"
        report_fresh() { [ -n "$REPORT_FILE" ] && [ -f "$REPORT_FILE" ] && [ "$REPORT_FILE" -nt "$RUN_STAMP" ]; }

        echo "::group::mutineer ${args[*]}"
        set +e
        "${runner[@]}" "${args[@]}"
        code=$?
        set -e
        # Keep the report visible in the log when it was auto-routed to a file.
        if [ -n "$AUTO_REPORT" ] && report_fresh; then
          cat "$REPORT_FILE"
        fi
        echo "::endgroup::"

        # Step summary + per-survivor annotations from the JSON report. jq ships
        # on GitHub-hosted runners; a self-hosted runner without it skips this
        # (the run's verdict is unaffected either way).
        if [ "$FORMAT" = "json" ] && report_fresh && command -v jq >/dev/null 2>&1; then
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            # `oneline` scrubs every interpolated report field to a single line
            # and neutralizes backticks so a survivor token cannot close the
            # inline-code span and inject markdown into the summary.
            # A diff-scoped run's score covers a different denominator than a
            # full-run baseline, so the baseline line must not juxtapose the two
            # scores as if comparable; the report itself says so (summary.scoped).
            jq -r --arg code "$code" '
              def oneline: tostring | gsub("[\r\n]"; " ") | gsub("`"; "'\''");
              ("## Mutineer " + (if $code == "0" then "passed" else "failed (exit \($code))" end)),
              "",
              "| Score | Killed | Survived | No coverage | Ignored | No verdict |",
              "|---|---|---|---|---|---|",
              ("| " + (.summary.score | if . == null then "N/A" else "\(.)%" end)
                 + " | \(.summary.killed) | \(.summary.survived) | \(.summary.no_coverage)"
                 + " | \(.summary.ignored) | \(.summary.no_verdict) |"),
              (if .baseline then
                 "", ("Baseline: \(.baseline.new_survivors | length) new survivor(s)"
                      + (if (.baseline.score_comparable != false) then
                           "; score \(.baseline.score_before // "N/A" | oneline) -> \(.baseline.score_after // "N/A" | oneline)"
                         else
                           "; score-drop check skipped (\(.baseline.score_after // "N/A" | oneline) now vs \(.baseline.score_before // "N/A" | oneline) baseline: scores from a diff-scoped side are not comparable)"
                         end)
                      + (if .baseline.regressed then ": REGRESSED." else "." end))
               else empty end),
              (if (.survivors | length) > 0 then "", "### Surviving mutants", "" else empty end),
              (.survivors[:20][]
                 | "- `" + (.file | oneline) + ":\(.line)` " + (.operator | oneline) + ": `"
                   + (.token | oneline) + "` (id `" + (.id | oneline) + "`)"),
              (if (.survivors | length) > 20 then
                 "", "… and \((.survivors | length) - 20) more: full list in the JSON report (the action'\''s `report` output)."
               else empty end)
            ' "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY" \
              || echo "::warning::mutineer: could not render the step summary."
          fi
          # Inline PR-diff annotations, capped at 50 (GitHub shows at most 10
          # per step in the checks UI; the rest stay on the files tab).
          # Level tracks the gate: a failing run annotates errors, a passing run
          # warnings — red marks on a green PR would be the wrong signal.
          # `msg` percent-escapes and single-lines message text; `prop` also
          # escapes the , and : that delimit workflow-command properties, so a
          # pathological path cannot corrupt the file= field.
          WD="${WORKING_DIRECTORY#./}"; WD="${WD%/}"
          jq -r --arg wd "$WD" --arg lvl "$([ "$code" = "0" ] && echo warning || echo error)" '
            def msg: tostring | gsub("%"; "%25") | gsub("[\r\n]"; " ");
            def prop: msg | gsub(":"; "%3A") | gsub(","; "%2C");
            .survivors[:50][]
            | (if (.file | startswith("/")) or $wd == "" or $wd == "."
               then .file else $wd + "/" + .file end) as $f
            | "::\($lvl) file=" + ($f | prop) + ",line=\(.line),title=Surviving mutant::"
              + (.operator | msg) + ": `" + (.token | msg)
              + "` survived: no test caught this change (id " + (.id | msg) + ")"
          ' "$REPORT_FILE" \
            || echo "::warning::mutineer: could not emit survivor annotations."
        elif [ "$FORMAT" = "json" ] && ! report_fresh && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          # The run died before writing a report (e.g. a usage error): say so in
          # the summary instead of leaving the documented surface silently blank.
          echo "Mutineer did not produce a report (exit $code); see the job log." >> "$GITHUB_STEP_SUMMARY"
        fi

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        # Expose the report path whenever THIS run wrote one — the caller's
        # `output` when set, else the auto-routed JSON report — so a later step
        # can consume the machine-readable report without scraping the log.
        # Absolutized: a relative `output` resolves against THIS step's
        # working-directory, which a later step at the repo root cannot see.
        if report_fresh; then
          # Heredoc form with a RANDOM delimiter: safe even if the caller-
          # supplied path contains a newline or a guessed fixed delimiter (a
          # plain KEY=VALUE line would let it inject extra outputs).
          EOF_MARK="MUTINEER_REPORT_$(od -An -tx8 -N8 /dev/urandom | tr -d ' \n')"
          {
            echo "report<<$EOF_MARK"
            echo "$(cd "$(dirname "$REPORT_FILE")" && pwd)/$(basename "$REPORT_FILE")"
            echo "$EOF_MARK"
          } >> "$GITHUB_OUTPUT"
        fi
        exit $code
