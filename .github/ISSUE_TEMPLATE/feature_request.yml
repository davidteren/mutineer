name: Feature request
description: Suggest a change to Mutineer.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Change you want
      description: The behaviour you want instead.
    validations:
      required: true
