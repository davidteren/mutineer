name: Bug report
description: Something in Mutineer is wrong.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Describe one defect.
        Do not report a security issue on this form.
        Use GitHub private vulnerability reporting for a security issue.
  - type: input
    id: ruby
    attributes:
      label: Ruby version
      description: The output of `ruby -v`.
      placeholder: ruby 3.4.4
    validations:
      required: true
  - type: input
    id: rails
    attributes:
      label: Rails version
      description: The Rails version. Write none if you do not use Rails.
      placeholder: 8.0.2 or none
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Database
      description: SQLite, PostgreSQL, MySQL, or none.
      placeholder: SQLite
    validations:
      required: true
  - type: input
    id: mutineer
    attributes:
      label: Mutineer version
      description: The output of `mutineer --version`.
      placeholder: 1.6.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The mutineer command you ran.
      placeholder: bundle exec mutineer run app/models/order.rb --test test/models/order_test.rb --rails
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: JSON excerpt
      description: A short excerpt from `--format json`. Write none if you have no JSON.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
