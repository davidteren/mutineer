name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release-pr.yml dispatches this on the release branch: its GITHUB_TOKEN push
  # starts no pull_request run, and the release PR needs the required checks.
  # This dispatch runs CI only. It does not tag or publish.
  workflow_dispatch:

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Mutineer is fork-based (Linux + macOS). Prism ships with Ruby >= 3.4.
        # 3.4 stays on Linux and macOS. 4.0 is the newest stable line, on Linux only.
        os: [ubuntu-latest, macos-latest]
        ruby: ["3.4"]
        include:
          - os: ubuntu-latest
            ruby: "4.0"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test
      - name: Build gem
        run: gem build mutineer.gemspec

  test-minitest6:
    name: test (ruby 3.4, minitest 6)
    runs-on: ubuntu-latest
    # The default Gemfile keeps Minitest 5. The stop at the first failure has
    # separate hooks for Minitest 5 and 6, so each major version needs a run.
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/minitest6.gemfile
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Mutineer clears BUNDLE_* before it runs a test command, so those child
      # processes fall back to the root Gemfile. Install that bundle too.
      - name: Install root bundle
        run: BUNDLE_GEMFILE="$GITHUB_WORKSPACE/Gemfile" bundle install
      - name: Run tests
        run: bundle exec rake test

  docs:
    name: yard strict (ruby 3.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Enforce 100% YARD documentation
        run: bundle exec rake yard:strict

  rails-integration:
    name: rails dogfood (ruby 3.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          # The Rails fixture app has its OWN isolated bundle (Rails must never
          # touch the gem's zero-dep bundle), so cache against that Gemfile.
          bundler-cache: true
          working-directory: test/fixtures/rails_app
      - name: Dogfood mutineer against a real minimal Rails app
        working-directory: test/fixtures/rails_app
        run: bin/dogfood
      # The daemon integration tests run in the gem process but spawn a daemon under
      # the fixture app's bundle (installed above), so they belong in this job.
      - name: Install the gem's own bundle
        run: bundle install
      - name: Daemon integration tests (Phase 2a)
        run: bundle exec rake test:daemon

  rails-postgres:
    name: rails daemon postgres 16 (ruby 3.4)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: mutineer_rails_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB: postgres
      BUNDLE_WITH: postgres
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: mutineer_rails_test
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: test/fixtures/rails_app
      - name: Install the fixture bundle with pg
        working-directory: test/fixtures/rails_app
        run: bundle install
      - name: Install the gem bundle
        run: bundle install
      - name: Daemon integration tests on Postgres 16
        run: bundle exec rake test:daemon

  rails-mysql:
    name: rails daemon mysql 8 (${{ matrix.adapter }}, ruby 3.4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The docs promise both clients, so both run against a real server.
        adapter: [mysql2, trilogy]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mutineer
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: mutineer_rails_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmutineer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB: mysql
      MYSQL_ADAPTER: ${{ matrix.adapter }}
      BUNDLE_WITH: mysql
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: mutineer
      MYSQL_DATABASE: mutineer_rails_test
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7
      - name: Install the MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client default-libmysqlclient-dev pkg-config
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: test/fixtures/rails_app
      - name: Install the fixture bundle with mysql2 and trilogy
        working-directory: test/fixtures/rails_app
        run: bundle install
      - name: Install the gem bundle
        run: bundle install
      - name: Daemon integration tests on MySQL 8
        run: bundle exec rake test:daemon

  site:
    name: website browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/browser/package-lock.json
      # These tests read the published tree; docs/ no longer carries the
      # generated files (YARD API docs, sitemap, llms-full.txt).
      - name: Build site
        run: bundle exec rake site:build
      - name: Check theme and copy logic
        run: node --test test/site_test.js
      - name: Install browser test tools
        working-directory: test/browser
        run: npm ci
      - name: Install Chromium
        working-directory: test/browser
        run: npx playwright install --with-deps chromium
      - name: Check website in Chromium
        working-directory: test/browser
        run: npm test

  # Scores a fixed slice of this gem. The flags stay in this job.
  # There is no root .mutineer.yml, so a local run is unchanged.
  # The slice skips harness files and tests that spawn bin/mutineer.
  # Those mutants cannot reach a subprocess. The measured score was 85.5%.
  # The threshold is that score, rounded down. Raise it here when the score rises.
  # The unit tests are not on the lib/ mirror path, so this job passes --test.
  self-dogfood:
    name: self-dogfood (threshold 85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Score config, mutant ids, and the baseline
        run: >
          bundle exec mutineer run
          lib/mutineer/config.rb
          lib/mutineer/mutant_id.rb
          lib/mutineer/baseline.rb
          --test test/config_test.rb
          --test test/mutant_id_test.rb
          --test test/baseline_test.rb
          --threshold 85
