name: Release

# Publishing is a manual act by a human collaborator with maintain or admin.
# A tag push does not start this workflow, and there is no schedule. Run it
# on an existing stable tag:
#
#   gh workflow run release.yml --ref vX.Y.Z -f confirm=publish
#
# The authorize job asks GitHub for the actor's repository permission and
# rejects bots, schedule events, and anyone below maintain. The publish job
# then waits for approval of the GitHub environment `rubygems`. Required
# reviewers are a repository setting (see AGENTS.md). After approval the job
# tests, publishes to RubyGems via Trusted Publishing (OIDC bound to that
# environment), opens the GitHub Release from the CHANGELOG, and moves the
# floating major tag (v1, v2, ...). That tag move is the last step of this
# approved job.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish to release this tag to RubyGems."
        required: true
        type: string

# The publish job is the only one that can push a release or mint OIDC credentials.
permissions:
  contents: read

# One release at a time. Two publishes in the same major (v1.0.0 then v1.0.1)
# overlapping would let the older run force-push @v1 backward after the
# newer one had already moved it. cancel-in-progress: false queues the
# second run instead of cancelling a publish already in flight.
concurrency:
  group: mutineer-release
  cancel-in-progress: false

jobs:
  refuse:
    name: refuse unless this is a confirmed tag dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: none
    # Wrong event, confirm word, or ref fails here, before any permission
    # lookup and before the publish job can ask for environment approval.
    if: >-
      github.event_name != 'workflow_dispatch'
      || github.event.inputs.confirm != 'publish'
      || !startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Refuse to publish
        env:
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          echo "::error::Refusing to publish. Release runs only from workflow_dispatch on a vX.Y.Z tag with confirm=publish. actor=${ACTOR} event=${EVENT} ref=${REF} confirm=${CONFIRM}. A tag push does not publish."
          exit 1

  authorize:
    name: human maintainer must start the publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The environment gate is on the publish job, which needs this job.
    # A write collaborator who dispatches a valid tag never reaches that gate.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.confirm == 'publish'
      && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Require a human with maintain or admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # MUTINEER_RELEASE_ACTOR_START
          # Schedule events are rejected before the API call. GitHub attributes a
          # cron to the last editor of this file, and that person may hold
          # maintain or admin, so a permission check alone would let the cron through.
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            echo "::error::A release workflow runs only from workflow_dispatch (event ${GITHUB_EVENT_NAME:-}). A schedule does not start a release."
            exit 1
          fi
          actor="${GITHUB_ACTOR:-}"
          case "$actor" in
            ""|*'[bot]')
              echo "::error::A bot cannot start a release (actor ${actor:-none})."
              exit 1
              ;;
          esac
          # Legacy `permission` maps the maintain role to write. Read the
          # maintain and admin flags, and accept role_name admin or maintain
          # for a response that omits the flags. A custom role that grants
          # maintain still passes, so adding a collaborator needs no workflow edit.
          if ! meta=$(gh api "repos/${GITHUB_REPOSITORY:?}/collaborators/${actor}/permission" --jq '[.user.type // "unknown", ((.user.permissions.admin // false) | tostring), ((.user.permissions.maintain // false) | tostring), (.role_name // "")] | .[]'); then
            echo "::error::Could not read repository permission for ${actor}. Refusing the release."
            exit 1
          fi
          mapfile -t fields <<<"$meta"
          kind="${fields[0]:-}"
          admin="${fields[1]:-}"
          maintain="${fields[2]:-}"
          role="${fields[3]:-}"
          if [ "$kind" != "User" ]; then
            echo "::error::A bot cannot start a release (actor ${actor}, type ${kind})."
            exit 1
          fi
          if [ "$admin" = "true" ] || [ "$maintain" = "true" ] || [ "$role" = "admin" ] || [ "$role" = "maintain" ]; then
            echo "Release actor ${actor} is a human with role ${role} (admin=${admin} maintain=${maintain})."
          else
            echo "::error::${actor} does not have maintain or admin on this repository (role ${role}). Write, triage, and read cannot start a release."
            exit 1
          fi
          # MUTINEER_RELEASE_ACTOR_END

  release:
    name: publish gem + github release
    needs: [authorize]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release and the floating major tag
      id-token: write   # OIDC token for RubyGems Trusted Publishing
    # Approval of environment `rubygems` happens before any step, and only
    # after authorize succeeded. Required reviewers are a GitHub setting.
    # Specifying `if` replaces the default needs-success check, so the result
    # is repeated here.
    if: >-
      needs.authorize.result == 'success'
      && github.event_name == 'workflow_dispatch'
      && github.event.inputs.confirm == 'publish'
      && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: rubygems
    steps:
      - name: Require a human with maintain or admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # MUTINEER_RELEASE_ACTOR_START
          # Schedule events are rejected before the API call. GitHub attributes a
          # cron to the last editor of this file, and that person may hold
          # maintain or admin, so a permission check alone would let the cron through.
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            echo "::error::A release workflow runs only from workflow_dispatch (event ${GITHUB_EVENT_NAME:-}). A schedule does not start a release."
            exit 1
          fi
          actor="${GITHUB_ACTOR:-}"
          case "$actor" in
            ""|*'[bot]')
              echo "::error::A bot cannot start a release (actor ${actor:-none})."
              exit 1
              ;;
          esac
          # Legacy `permission` maps the maintain role to write. Read the
          # maintain and admin flags, and accept role_name admin or maintain
          # for a response that omits the flags. A custom role that grants
          # maintain still passes, so adding a collaborator needs no workflow edit.
          if ! meta=$(gh api "repos/${GITHUB_REPOSITORY:?}/collaborators/${actor}/permission" --jq '[.user.type // "unknown", ((.user.permissions.admin // false) | tostring), ((.user.permissions.maintain // false) | tostring), (.role_name // "")] | .[]'); then
            echo "::error::Could not read repository permission for ${actor}. Refusing the release."
            exit 1
          fi
          mapfile -t fields <<<"$meta"
          kind="${fields[0]:-}"
          admin="${fields[1]:-}"
          maintain="${fields[2]:-}"
          role="${fields[3]:-}"
          if [ "$kind" != "User" ]; then
            echo "::error::A bot cannot start a release (actor ${actor}, type ${kind})."
            exit 1
          fi
          if [ "$admin" = "true" ] || [ "$maintain" = "true" ] || [ "$role" = "admin" ] || [ "$role" = "maintain" ]; then
            echo "Release actor ${actor} is a human with role ${role} (admin=${admin} maintain=${maintain})."
          else
            echo "::error::${actor} does not have maintain or admin on this repository (role ${role}). Write, triage, and read cannot start a release."
            exit 1
          fi
          # MUTINEER_RELEASE_ACTOR_END

      - name: "Guard: manual dispatch, confirm word, tag ref"
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          # MUTINEER_PUBLISH_GATE_START
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            echo "::error::Publishing runs only from a manual workflow_dispatch (event ${GITHUB_EVENT_NAME:-}). A tag push does not publish."
            exit 1
          fi
          if [[ "${GITHUB_REF:-}" != refs/tags/v* ]]; then
            echo "::error::Run Release on a vX.Y.Z tag (got ${GITHUB_REF:-}). Pushing the tag does not publish; dispatch this workflow on that tag."
            exit 1
          fi
          if [ "${CONFIRM:-}" != "publish" ]; then
            echo "::error::Refusing to publish until confirm=publish (got ${CONFIRM:-})."
            exit 1
          fi
          # MUTINEER_PUBLISH_GATE_END

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1 — pinned: privileged (id-token) job
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # A mistyped tag must never publish the wrong version. Prereleases
      # (v1.3.1-rc1) and junk (v1.2.3.4) must neither publish nor move the
      # floating major tag that Action users pin.
      - name: "Guard: stable tag matching Mutineer::VERSION"
        run: |
          set -euo pipefail
          # MUTINEER_STABLE_TAG_START
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a stable vMAJOR.MINOR.PATCH tag. Prereleases and malformed tags are not published and do not move the major tag. Aborting release."
            exit 1
          fi
          # MUTINEER_STABLE_TAG_END
          tag="${GITHUB_REF_NAME#v}"
          ver="$(ruby -r ./lib/mutineer/version -e 'print Mutineer::VERSION')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Mutineer::VERSION ($ver). Aborting release."
            exit 1
          fi

      - name: Tests
        run: bundle exec rake test
      - name: Pages site builds
        run: bundle exec rake site:build

      # Exchanges the workflow's OIDC token for short-lived RubyGems credentials.
      # The trusted publisher on rubygems.org must name environment `rubygems`
      # (see AGENTS.md). No secret, no OTP.
      - name: Configure RubyGems Trusted Publishing (OIDC)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Build & push gem
        run: |
          set -euo pipefail
          gem build mutineer.gemspec
          gem push mutineer-*.gem

      - name: GitHub release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '$0 ~ "^## \\["ver"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then printf 'Release %s\n' "$GITHUB_REF_NAME" > notes.md; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

      # The floating major tag (v1, v2, ...) tracks the newest release in its
      # line, so `uses: <this repository>@v1` follows the latest v1.x.y.
      # This push happens only after the environment approval and the gem push.
      # The tag name is a single component (v1, v2, ...). This workflow has no
      # tag trigger, so the push does not start another publish.
      - name: Move floating major tag
        run: |
          set -euo pipefail
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_REF_NAME"
          git push -f origin "$major"
