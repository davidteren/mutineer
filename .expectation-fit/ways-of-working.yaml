# Expectation Fit — project config for mutineer.
# Merges over the plugin defaults; /fit-setup upgrade migrates old layouts.
# Every lens treats each note below as a repo rule; the convention lens reports a
# breach as a finding. The notes come from the 2026-10 shift-left audit of all
# merged PRs (postmortem of issues #252/#253/#254 and issues #279-#293).
version: 1

conventions:
  extends: true
  notes:
    - 'Track every limitation: A documented limitation, deferred trade-off,
      or "cannot yet" that leaves work undone names its GitHub issue in the
      same change. Prose alone does not record a hazard.'
    - 'Cover the siblings: A fix to one path or surface names its siblings
      and covers or tracks each one (reload vs redefine, daemon vs
      in-process, Action vs CLI, report vs dry-run).'
    - 'Gate on unrounded values: A gate or threshold compares unrounded
      values. Rounding is for display only.'
    - 'Count what you exclude: A new verdict class, skip, or exclusion that
      leaves the score ships with a visible count and a budget or warning
      in the same change.'
    - 'Estimate exclusion frequency: A conservative exclusion (select
      nothing, report nothing, skip the case) records an estimate of how
      often real code hits the case.'
    - 'One seed contract: The clean check and the mutant runs share one
      ordering and seed contract. (Known open gap: issue #282, the clean
      check does not pin the seed that mutant runs use.)'
    - 'Assert the mechanism: A regression test asserts the mechanism
      (owner, arity, the named killing test), never only "killed",
      "passes", or an exit code.'
    - 'Repro becomes fixture: An externally reported bug lands its minimal
      repro as a fixture with expected verdicts in the same PR as the fix.'
